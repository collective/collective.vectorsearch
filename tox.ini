[tox]
envlist =
    py{310,311,312,313}-lint,
    ruff-check,
    py{310,311}-Plone60,
    py{310,311,312,313}-Plone61,
    py312-Plone61-pep420,
#    docs,
#    coverage-report,

skip_missing_interpreters = True


[testenv]
skip_install = true

extras =
    develop
    test

commands =
    {envbindir}/buildout -c {toxinidir}/{env:version_file} buildout:directory={envdir} buildout:develop={toxinidir} bootstrap
#    {envbindir}/buildout -c {toxinidir}/{env:version_file} buildout:directory={envdir} buildout:develop={toxinidir} annotate
    {envbindir}/buildout -n -c {toxinidir}/{env:version_file} buildout:directory={envdir} buildout:develop={toxinidir} install test robot
    coverage run {envbindir}/test -v1 --auto-color {posargs}
    # coverage run {envbindir}/test -v --all -t robot {posargs}

setenv =
    COVERAGE_FILE=.coverage.{envname}
    Plone60: version_file=test_plone60.cfg
    Plone61: version_file=test_plone61.cfg

deps =
    Plone60: -rrequirements_plone60.txt
    Plone61: -rrequirements_plone61.txt
    coverage


# Test PEP 420 namespace fallback (setuptools>=82, no pkg_resources)
# Uses pip install instead of buildout, since buildout requires pkg_resources
[testenv:py312-Plone61-pep420]
skip_install = false
usedevelop = true

deps =
    setuptools>=82
    plone.app.testing
    plone.testing>=5.0.0
    plone.app.contenttypes
    zope.testrunner
    coverage

commands =
    coverage run -m zope.testrunner --test-path={toxinidir}/src -s collective.vectorsearch -v1 --auto-color {posargs}

setenv =
    COVERAGE_FILE=.coverage.{envname}


[testenv:coverage-report]
skip_install = true
usedevelop = True
basepython = python3.11

deps =
    coverage
    -cconstraints_plone61.txt

setenv =
    COVERAGE_FILE=.coverage

commands =
    coverage erase
    coverage combine
    coverage html
    coverage xml
    coverage report


[lint]
skip_install = true

deps =
    -cconstraints.txt
    ruff

commands =
    ruff check {toxinidir}/src


[testenv:ruff-check]
basepython = python3.11
skip_install = True
deps =
    -cconstraints.txt
    ruff

commands =
    ruff check src
    ruff format --check --diff src


[testenv:ruff-fix]
basepython = python3.11
skip_install = True
deps =
    -cconstraints.txt
    ruff

commands =
    ruff check --fix src
    ruff format src


[testenv:py310-lint]
basepython = python3.10
skip_install = true
deps = {[lint]deps}
commands = {[lint]commands}

[testenv:py311-lint]
basepython = python3.11
skip_install = true
deps = {[lint]deps}
commands = {[lint]commands}

[testenv:py312-lint]
basepython = python3.12
skip_install = true
deps = {[lint]deps}
commands = {[lint]commands}

[testenv:py313-lint]
basepython = python3.13
skip_install = true
deps = {[lint]deps}
commands = {[lint]commands}

[testenv:docs]
skip_install = true

deps =
    Sphinx

commands =
    sphinx-build -b html -d _build/docs/doctrees docs _build/docs/html
