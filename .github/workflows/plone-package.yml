# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Plone package

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Ruff-Check
        run: |
          tox -r -e ruff-check

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        plone-version: ['Plone61']
        include:
          # Plone 6.0 (old-style buildout + pkg_resources)
          - python-version: '3.10'
            plone-version: 'Plone60'
            tox-envs: 'py310-Plone60'
          - python-version: '3.11'
            plone-version: 'Plone60'
            tox-envs: 'py311-Plone60'
          # Plone 6.1 (buildout + pkg_resources)
          - python-version: '3.10'
            plone-version: 'Plone61'
            tox-envs: 'py310-Plone61'
          - python-version: '3.11'
            plone-version: 'Plone61'
            tox-envs: 'py311-Plone61'
          - python-version: '3.12'
            plone-version: 'Plone61'
            tox-envs: 'py312-Plone61'
          - python-version: '3.13'
            plone-version: 'Plone61'
            tox-envs: 'py313-Plone61'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/buildout-cache
            ~/extends
          key: ${{ runner.os }}-tox-${{ matrix.python-version }}-${{ matrix.plone-version }}-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('**/requirements*.txt') }}-${{ hashFiles('**/*.cfg') }}-${{ hashFiles('**/constraints*.txt') }}-${{ hashFiles('**/tox.ini') }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup buildout cache
        run: |
          mkdir -p ~/buildout-cache/{eggs,downloads}
          mkdir -p ~/.buildout
          echo "[buildout]" > $HOME/.buildout/default.cfg
          echo "download-cache = $HOME/buildout-cache/downloads" >> $HOME/.buildout/default.cfg
          echo "eggs-directory = $HOME/buildout-cache/eggs" >> $HOME/.buildout/default.cfg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Test with tox
        run: |
          tox -r -e ${{ matrix.tox-envs }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
        if: matrix.python-version == '3.11'
